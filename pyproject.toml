[project]
name = "paribus"
version = "0.1.0"
description = "Find the input slices behind your ASR pipeline's hallucinations and costs, and prove every fix with a controlled experiment."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.14.0",
    "av>=19.0.2",
    "fastmcp>=4.2",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "numpy>=2.5.5",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "soxr>=1.1.0",
    "typer>=0.29.3",
]

[project.scripts]
paribus = "paribus.cli:app"

[project.optional-dependencies]
report = [
    "matplotlib>=3.11.2",
]
tracing = [
    "arize-phoenix-otel>=0.17.3",
]
keychain = [
    "keyring>=25.7.0",
]
hf = [
    "datasets>=5.2.0",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src:."
packages = ["paribus", "testsets"]

[[tool.mypy.overrides]]
# These ship no type hints.
module = ["datasets", "soxr"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "paribus.agent.*"
disallow_untyped_calls = false
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root, so tests can import the `testsets` package that lives outside src/.
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = ["integration: needs more than unit scope"]
filterwarnings = [
    "error",
    # langsmith (pulled in by langgraph) calls asyncio.iscoroutinefunction, deprecated in 3.14.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]

[dependency-groups]
dev = [
    "datasets>=5.2.0",
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]
