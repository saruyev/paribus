# T0 component test set: which VAD, tagger, LID and ASR to pick (see docs/architecture.md).
# Every condition is applied to the same phrases (paired design).
# Revisions marked PIN are resolved to commit shas on the machine that builds the set,
# because a branch name can move under us.
name: t0-components
seed: 20261128
sample_rate: 16000

speech:
  - source: &librispeech
      type: hf
      name: librispeech_en
      dataset: gilkeyio/librispeech-alignments
      revision: PIN
      split: test_clean
      id_column: id
      text_column: transcript
      transcripts: reference
      speech_segments_column: words
      meta_columns: [sex]
      language: en
      license: CC-BY-4.0
    take: 50
    duration: [3, 20]
  - source:
      <<: *librispeech
      name: librispeech_en_short
    take: 30
    duration: [0.5, 3]
  - source:
      type: hf
      name: fleurs_ru
      dataset: google/fleurs
      revision: PIN   # a commit of refs/convert/parquet
      subset: ru_ru
      split: test
      text_column: raw_transcription
      transcripts: reference
      meta_columns: [gender]
      language: ru
      license: CC-BY-4.0
    take: 30
    duration: [3, 20]

backgrounds:
  music:
    source:
      type: hf
      name: musan_music
      dataset: Akiki-AI/akiki-vad-silero623-v1-musan-music-cc-by-3.0
      revision: PIN
      split: train
      id_column: sample_id
      license: CC-BY-3.0
  noise:
    source:
      type: hf
      name: musan_noise
      dataset: Akiki-AI/akiki-vad-silero623-v1-musan-noise
      revision: PIN
      split: train
      id_column: sample_id
      meta_columns: [audio_license]
      license: per-recording
    license_column: audio_license
    licenses: [CC-BY-4.0, CC-BY-3.0, public-domain]   # values checked against the data before building

conditions:
  - name: clean
  - {name: noise_snr0, ops: [{mix: {background: noise, snr_db: 0}}]}
  - {name: noise_snr5, ops: [{mix: {background: noise, snr_db: 5}}]}
  - {name: noise_snr10, ops: [{mix: {background: noise, snr_db: 10}}]}
  - {name: noise_snr20, ops: [{mix: {background: noise, snr_db: 20}}]}
  - {name: music_snr0, ops: [{mix: {background: music, snr_db: 0}}]}
  - {name: music_snr10, ops: [{mix: {background: music, snr_db: 10}}]}
  - {name: music_snr20, ops: [{mix: {background: music, snr_db: 20}}]}
  - {name: pad_zero, ops: [{pad: {before: [5, 20], after: [5, 20], fill: zero}}]}
  - {name: pad_floor, ops: [{pad: {before: [5, 20], after: [5, 20], fill: floor}}]}
  - {name: telephone, ops: [{resample: 8000}, {codec: pcm_mulaw}]}
  - {name: opus12k, ops: [{codec: {name: opus, bitrate: 12000}}]}
  - {name: quiet, ops: [{gain: -20}]}
  - {name: only_music, speech: none, count: 20, ops: [{generate: {fill: music, seconds: [5, 15]}}]}
  - {name: only_noise, speech: none, count: 20, ops: [{generate: {fill: noise, seconds: [5, 15]}}]}
  - {name: only_zero, speech: none, count: 10, ops: [{generate: {fill: zero, seconds: [5, 15]}}]}
  - {name: only_floor, speech: none, count: 10, ops: [{generate: {fill: floor, seconds: [5, 15]}}]}
